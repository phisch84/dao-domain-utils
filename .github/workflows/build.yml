# Builds the library, runs the tests and the strict Javadoc check (mvn verify)
# on every push and pull request, with the LTS JDKs the project is built with.
# The code is compiled for Java 8 (maven.compiler.release); JDK 8 itself can't build it,
# because javac's --release option requires JDK 9 or newer.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build, test and check Javadoc
        run: mvn -B -ntp verify

      # The coverage report (JaCoCo, written by mvn verify) is the same on both JDKs, so it is kept once.
      # Only after a successful build: a failed build stops before the report is written.
      - name: Upload coverage report
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore
