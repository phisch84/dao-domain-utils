# Builds, tests and deploys the library to GitHub Packages when a release is published on GitHub
# ("published", not "created": saving a draft release must not publish anything).
# deploy runs all earlier phases, so the tests and the strict Javadoc check run again before anything is uploaded.
# The artifacts are built once, with JDK 21 (the build workflow also tests JDK 25); they are compiled for Java 8.
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: mvn deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github # the id of distributionManagement/repository in pom.xml
          settings-path: ${{ github.workspace }} # location of the generated settings.xml

      - name: Build, test and deploy to GitHub Packages
        run: mvn -B -ntp deploy -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
